# One wildcard cert for every app. It lives in kube-system because Traefik (K3s built-in) runs there
# and a TLSStore can only reference a Secret in its own namespace (see tlsstore.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shubhrajitpallob-dev-wildcard
  namespace: kube-system
spec:
  secretName: shubhrajitpallob-dev-wildcard-tls
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  commonName: shubhrajitpallob.dev
  dnsNames:
    - shubhrajitpallob.dev
    - "*.shubhrajitpallob.dev"
