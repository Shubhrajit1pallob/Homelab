# cloudflared config for the GREEN tunnel `k8s-cluster` (locally managed; plan: clusters/homelab/bootstrap/CHANGE-2026-10-26-tunnel-blue-green.md).
# Becomes the ConfigMap `cloudflared-config-<hash>` via configMapGenerator, so any edit rolls the pods.
# The tunnel UUID is an identifier, not a secret; the credentials JSON is the secret and lives in secrets/.
# Wildcards only: admin hostnames are never listed in this public repo. Which names are public and which sit
# behind Cloudflare Access is decided in the Cloudflare dashboard (DNS records and Access apps), not here.
tunnel: 9d550ce4-f55f-4e2c-af9b-eb20450e5940
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true
# http2 (TCP 7844), not the default QUIC: the pod MTU is 1230 (flannel VXLAN over tailscale0), below QUIC's ~1252-byte
# packets sent with Don't Fragment, so QUIC never connects; TCP 7844 works.
protocol: http2
ingress:
  - hostname: shubhrajitpallob.dev
    service: http://traefik.kube-system.svc.cluster.local:80
  - hostname: "*.shubhrajitpallob.dev"
    service: http://traefik.kube-system.svc.cluster.local:80
  - service: http_status:404
