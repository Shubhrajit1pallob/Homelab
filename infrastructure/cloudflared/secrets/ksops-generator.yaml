# KSOPS generator: decrypts the SOPS files below at sync time (clusters/homelab/bootstrap/SECRETS-SOPS.md).
# Paths in `files:` are relative to the KUSTOMIZATION ROOT (infrastructure/cloudflared), not to this file's folder.
# secrets/tunnel-credentials.enc.yaml is created in phase 1 of CHANGE-2026-10-26-tunnel-blue-green.md, by piping the
# green tunnel's credentials JSON into `sops -e`; it does not exist yet.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cloudflared-secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets/tunnel-credentials.enc.yaml
