# PARKED - blue/green tunnel cutover. Plan, phases and rollback: clusters/homelab/bootstrap/CHANGE-2026-10-26-tunnel-blue-green.md
# BLUE = the dashboard-managed tunnel `k8s_cloud`, connector on the shubmedia host, routes -> http://localhost:80. Left
# untouched as the rollback. GREEN = a NEW locally-managed tunnel `k8s-cluster` run by this app in-cluster (2 replicas on
# agent-1), ingress in infrastructure/cloudflared/config.yaml (wildcards -> Traefik's in-cluster Service). The two never
# share a token, so there is no split traffic: each hostname's DNS CNAME points at exactly one tunnel, and the cutover
# is flipping those CNAMEs one at a time (rollback = flip back).
# Before enabling (details in the change record, phase 1):
#   1. the user creates the tunnel (`cloudflared tunnel create k8s-cluster`) and the credentials are encrypted into
#      infrastructure/cloudflared/secrets/tunnel-credentials.enc.yaml (Secret `tunnel-credentials`, key `credentials.json`);
#   2. replace TUNNEL_UUID_CHANGE_ME in infrastructure/cloudflared/config.yaml with the new tunnel's UUID;
#   3. add `cloudflared` to the namespaces in the ArgoCD cluster Secret (clusters/homelab/bootstrap/cluster-in-cluster.yaml)
#      and `kubectl apply -f` it, or the sync fails with `namespace "cloudflared" is not managed`;
#   4. then move this file to applications/. The Namespace (with Pod Security labels) comes from the kustomization.
# Cleanup in phase 3: delete the old kube-system/tunnel-token by hand, the blue tunnel and the host connector.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Shubhrajit1pallob/Homelab.git
    targetRevision: main
    path: infrastructure/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
