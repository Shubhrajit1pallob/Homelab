# Enabled 2026-10-04. Grafana's admin login is Secret grafana-admin, SOPS-encrypted in
# apps/monitoring/prometheus/secrets/ and created by the monitoring-config app (since 2026-10-17; it was made by
# hand before). On a rebuild, Grafana waits in CreateContainerConfigError until monitoring-config has synced it.
# Expected cost: roughly 1 GiB of RAM on shubmedia. Enable AFTER the portfolio, one app at a time.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.7.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/apps/monitoring/prometheus/values.yaml
    - repoURL: https://github.com/Shubhrajit1pallob/Homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the operator CRDs are far larger than the client-side apply limit
