# n8n for tenant "shawn" (apps/n8n/tenants/shawn). Plan and limits: apps/n8n/REQUIREMENTS.md.
# Enabled 2026-10-19 with the database only (CNPG Cluster n8n-db, Barman backups to R2): verified that day,
# first base backup completed and WAL archiving on. Phase 2 adds the n8n app itself (Deployment, Service,
# IngressRoute, behind Cloudflare Access).
# Needs cnpg-operator and cnpg-barman-plugin, and n8n in the cluster Secret's namespaces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Shubhrajit1pallob/Homelab.git
    targetRevision: main
    path: apps/n8n/tenants/shawn
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true # CNPG / Barman / PodMonitor CRDs come from other Applications
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
