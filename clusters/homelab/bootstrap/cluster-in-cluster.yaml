# NOT synced by ArgoCD (applied by hand, see README). Limits the controller's in-cluster cache to the
# namespaces argocd, portfolio, cert-manager, kube-system, monitoring and rag-api (cert-manager/kube-system
# added 2026-10-04 for the cert-manager adoption, monitoring added 2026-10-04 for kube-prometheus-stack,
# rag-api added 2026-10-12 for the parked rag-api app; harmless to apply before that app is enabled);
# clusterResources is "true" because apps/portfolio includes a Namespace.
# Any new namespace an Application deploys into must be added to `namespaces` below and this Secret
# re-applied by hand with `kubectl apply -f`, or the Application fails with `namespace "X" is not managed`.
# After applying, check argocd-application-controller logs for in-cluster auth errors.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
  namespaces: "argocd,portfolio,cert-manager,kube-system,monitoring,rag-api"
  clusterResources: "true"
