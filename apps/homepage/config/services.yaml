# Static entries only. Add more tiles here; nothing secret belongs in this file.
# `siteMonitor` is checked by the Homepage pod. Use a PUBLIC URL that isn't behind Cloudflare Access, not an in-cluster
# Service: ns portfolio is default-deny ingress (apps/portfolio/networkpolicy.yaml), so homepage -> portfolio:8000
# times out. The public URL also tests the real path (Cloudflare -> tunnel -> Traefik -> site).
# Don't add siteMonitor to Access-protected hostnames: they answer 302 to the login page.
- Apps:
    - Portfolio:
        icon: mdi-web
        href: https://shubhrajitpallob.dev
        description: Public site
        siteMonitor: https://shubhrajitpallob.dev
        namespace: portfolio
        app: portfolio
    - n8n:
        icon: n8n.png
        href: https://n8n.shubhrajitpallob.dev
        description: Workflows
        namespace: n8n
        app: n8n
- Cluster:
    - ArgoCD:
        icon: argo-cd.png
        href: https://argocd.shubhrajitpallob.dev
        description: GitOps
        namespace: argocd
        app: argocd-server
    - Grafana:
        icon: grafana.png
        href: https://grafana.shubhrajitpallob.dev
        description: Dashboards
        namespace: monitoring
        app: grafana
