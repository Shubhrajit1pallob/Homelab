# rag-api holds paid API keys and the database credentials, so it is locked down both ways:
#   ingress: the portfolio Pods, on 8000; the n8n app Pod (n8n namespace, the reindex workflow), on 8000, API
#            Pods only; and Prometheus (monitoring namespace), on 9090 (metrics)
#   egress:  DNS to CoreDNS, then HTTPS (Voyage, Anthropic) and Postgres (Supabase session pooler, 5432)
#            to addresses OUTSIDE the cluster and tailnet only
# Enforced by k3s's embedded network-policy controller. NOT YET TESTED here (same as apps/portfolio): after
# the first deploy, confirm a chat question works end to end, and that a throwaway Pod in another namespace
# times out on rag-api.rag-api:8000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: rag-api
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portfolio-to-api
  namespace: rag-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portfolio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: portfolio
      ports:
        - protocol: TCP
          port: 8000
---
# n8n's rag-api reindex workflow (apps/n8n) POSTs and deletes documents with the admin key. The API Pods only
# (component: api), not the supabase-keepalive CronJob's, which share name=rag-api. apps/n8n's allow-n8n-egress
# has the matching egress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-n8n-to-api
  namespace: rag-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n
          podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 8000
---
# Prometheus scrapes /metrics on 9090 (rag-api v0.3.0+). Same rule as the portfolio's; any pod in `monitoring`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-metrics
  namespace: rag-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: rag-api
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-apis
  namespace: rag-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16   # Pod CIDR
              - 10.43.0.0/16   # Service CIDR
              - 100.64.0.0/10  # Tailscale (node IPs)
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
