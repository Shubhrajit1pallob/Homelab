# KSOPS generator: decrypts the SOPS files below at sync time (clusters/homelab/bootstrap/SECRETS-SOPS.md).
# Paths in `files:` are relative to the KUSTOMIZATION ROOT (apps/rag-api), not to this file's folder.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: rag-api-secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets/rag-api-secrets.enc.yaml
