# ClusterIP only: rag-api is never exposed through Traefik or the tunnel. Its one client is the portfolio's
# /api/chat route, which reaches it at http://rag-api.rag-api.svc.cluster.local:8000. Port 9090 is metrics only.
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag-api
  labels:
    app.kubernetes.io/name: rag-api
spec:
  type: ClusterIP
  # component: api too, so the keepalive CronJob's pods (same name label, for the NetworkPolicy) are never
  # picked as endpoints.
  selector:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
    # Scraped by Prometheus (ServiceMonitor rag-api in apps/monitoring/prometheus); NetworkPolicy
    # allow-monitoring-to-metrics limits it to the monitoring namespace.
    - name: metrics
      port: 9090
      targetPort: metrics
