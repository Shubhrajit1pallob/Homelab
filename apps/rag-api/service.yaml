# ClusterIP only: rag-api is never exposed through Traefik or the tunnel. Its one client is the portfolio's
# /api/chat route, which reaches it at http://rag-api.rag-api.svc.cluster.local:8000.
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag-api
  labels:
    app.kubernetes.io/name: rag-api
spec:
  type: ClusterIP
  # component: api too, so the keepalive CronJob's pods (same name label, for the NetworkPolicy) are never
  # picked as endpoints.
  selector:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
