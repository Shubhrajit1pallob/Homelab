apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - cronjob.yaml
# The rag-api image tag, set once here for the Deployment and the keepalive CronJob. Use the immutable
# sha-<full commit> tag the rag-api repo's CI publishes. The placeholder can't pull, which is why the
# Application is parked.
images:
  - name: ghcr.io/shubhrajit1pallob/rag-api
    newTag: sha-REPLACE_WITH_FIRST_CI_BUILD
