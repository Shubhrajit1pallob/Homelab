apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
spec:
  # Traefik ships with k3s, so this class already exists - nothing to install.
  ingressClassName: traefik
  rules:
    - host: shubhrajitpallob.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
    - host: www.shubhrajitpallob.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http

# Deliberately no tls: block. Cloudflare terminates TLS at its edge and cloudflared carries the request to
# Traefik over the tunnel, so the hop Traefik serves is plain HTTP inside the cluster. Both hostnames need a
# published route on the tunnel (service http://localhost:80 while the connector runs on the shubmedia host).
