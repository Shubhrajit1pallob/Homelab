# KSOPS generator: decrypts the SOPS files below at sync time (clusters/homelab/bootstrap/SECRETS-SOPS.md).
# Paths in `files:` are relative to the KUSTOMIZATION ROOT (apps/portfolio), not to this file's folder.
#
# rag-api-key.enc.yaml exists but is deliberately NOT listed: add ./secrets/rag-api-key.enc.yaml here only when
# rag-api is live, because the RAG_API_KEY env var switches the public chat on.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: portfolio-secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets/portfolio-views.enc.yaml
