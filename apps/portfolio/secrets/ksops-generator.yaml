# KSOPS generator: decrypts the SOPS files below at sync time (clusters/homelab/bootstrap/SECRETS-SOPS.md).
# Paths in `files:` are relative to the KUSTOMIZATION ROOT (apps/portfolio), not to this file's folder.
#
# rag-api-key.enc.yaml (rag-api's QUERY key) switches the public chat on: the portfolio shows the chat launcher
# once RAG_API_KEY is set. Added 2026-10-14 after rag-api went live with 15 documents loaded. To hide the chat
# again, remove that line, push, and restart the portfolio.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: portfolio-secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets/portfolio-views.enc.yaml
  - ./secrets/rag-api-key.enc.yaml
