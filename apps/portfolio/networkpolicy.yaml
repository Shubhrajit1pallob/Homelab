# Network segmentation for the portfolio namespace: default-deny ingress, then allow only
#   1. Traefik (kube-system) to the site on 8000
#   2. the monitoring namespace to the metrics on 9090
#   3. the n8n app Pod (n8n namespace) to 9090, for the rag-api reindex workflow's document export
# k3s enforces these with its embedded network-policy controller. NOT YET TESTED on this cluster: after the
# first deploy confirm from a throwaway Pod in another namespace that ports 8000 and 9090 time out, and that
# the site still loads through Traefik. If Traefik is ever run from another namespace, update rule 1.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: portfolio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-site
  namespace: portfolio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-metrics
  namespace: portfolio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
---
# n8n's rag-api reindex workflow reads the site's documents from /internal/rag-documents (and /internal/version;
# live since sha-435907b) on 9090, the Service's `metrics` port, which the site's Ingress doesn't route (it uses
# `http` only), so the endpoint isn't public. Only the n8n app Pod, not its database.
# apps/n8n's allow-n8n-egress has the matching egress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-n8n-to-internal
  namespace: portfolio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n
          podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 9090
