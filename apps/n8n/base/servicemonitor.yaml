# n8n's /metrics (on because N8N_METRICS=true in config.env). Our Prometheus selects ServiceMonitors from every
# namespace regardless of labels (apps/monitoring/prometheus/values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: n8n
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: app
  endpoints:
    - port: http
      path: /metrics
