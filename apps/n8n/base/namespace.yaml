apiVersion: v1
kind: Namespace
metadata:
  name: n8n
  labels:
    app.kubernetes.io/part-of: n8n
  annotations:
    # The database's PVC lives in this namespace, so removing this file or deleting the Application must never
    # delete the namespace (see postgres-cluster.yaml).
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
