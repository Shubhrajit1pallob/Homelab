# n8n itself. Settings: config.env (+ the tenant's config.env); database: the CNPG Cluster n8n-db
# (postgres-cluster.yaml). See apps/n8n/REQUIREMENTS.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: app
  annotations:
    # After the Cluster (wave 0), so the database exists before n8n's first start runs its migrations.
    argocd.argoproj.io/sync-wave: "1"
spec:
  # One pod: two would run every schedule twice, and the data volume is ReadWriteOnce.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: app
    spec:
      # n8n never calls the Kubernetes API.
      automountServiceAccountToken: false

      # The image's `node` user is 1000:1000 (checked in n8nio/n8n:2.43.8's /etc/passwd).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # REQUIRED: agent-1 only (node-role=cloud), next to its database. shubmedia is a laptop; server-1 is tainted.
      nodeSelector:
        node-role: cloud

      # The n8n images are musl (Alpine), and agent-1's host adds search domains such as is.cc that answer NOERROR
      # with no record. musl stops the search at that answer and never tries the real name, so with the default
      # ndots:5 api.github.com etc. fail with ENOTFOUND. ndots 1 makes any dotted name absolute. Consequence: musl
      # never falls back to search for those, so cluster services need a short name (same namespace, e.g. n8n-db-rw)
      # or the FQDN (rag-api.rag-api.svc.cluster.local); `rag-api.rag-api` FAILS. Pod-level, so it covers both
      # containers. See REQUIREMENTS.md "DNS".
      dnsConfig:
        options:
          - name: ndots
            value: "1"

      containers:
        - name: n8n
          # Pinned to the current stable release (the `stable` tag on Docker Hub and the latest GitHub release,
          # 2026-10-19). Never latest/next.
          image: docker.io/n8nio/n8n:2.43.8
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5678

          envFrom:
            - configMapRef:
                name: n8n-config
          env:
            # Keeps Node's heap under the 1Gi memory limit, so n8n hits its own heap limit before the OOM killer.
            - name: NODE_OPTIONS
              value: --max-old-space-size=768
            # Generated by CNPG for the Cluster's owner (bootstrap.initdb.owner: n8n).
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-db-app
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-db-app
                  key: password
            # Encrypts every credential stored in the database. Not optional: without it n8n would invent a key,
            # and credentials saved with that key would be unreadable after a restore. Also in the password manager.
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-encryption
                  key: N8N_ENCRYPTION_KEY
            # Shared with the task-runners container below; the broker accepts only runners presenting it.
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-runners
                  key: N8N_RUNNERS_AUTH_TOKEN

          # The first start runs the database migrations before the HTTP server listens: up to 5 minutes here.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # /healthz: the process answers (doesn't check the DB).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # /healthz/readiness: 200 only when the DB is connected and migrated.
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            # No CPU limit, as with the other apps (a limit only buys throttling).
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n

        # Runs the Code node's JavaScript and Python (n8n's external task-runner mode). Same version as n8n, as the
        # docs require. Hardened per n8n's "Harden task runners" page: distroless image, nobody user 65532,
        # read-only root filesystem with only /tmp writable. It gets the auth token and nothing else: no DB
        # password, no encryption key, no data volume. The launcher starts the runners on demand (~5Mi idle).
        - name: task-runners
          image: docker.io/n8nio/runners:2.43.8-distroless
          imagePullPolicy: IfNotPresent
          env:
            # Reaches n8n's broker at the default http://127.0.0.1:5679 (same pod, so localhost).
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-runners
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: GENERIC_TIMEZONE
              value: America/New_York
            # Passed to the JavaScript runner; keeps its heap under this container's limit.
            - name: NODE_OPTIONS
              value: --max-old-space-size=192
            # NOT set here: NODE_FUNCTION_ALLOW_BUILTIN. The launcher passes the JS runner only the env names in
            # the image's /etc/n8n-task-runners.json `allowed-env`, which doesn't list it, so a value here is
            # dropped. The same file's `env-overrides` already sets NODE_FUNCTION_ALLOW_BUILTIN=crypto (and
            # NODE_FUNCTION_ALLOW_EXTERNAL=moment), which the reindex workflow's GitHub HMAC check needs
            # (crypto.timingSafeEqual). Checked in 2.43.8-distroless; re-check that file on every upgrade.
          ports:
            - name: launcher-health
              containerPort: 5680
          livenessProbe:
            httpGet:
              path: /healthz
              port: launcher-health
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runner-tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: runner-tmp
          emptyDir:
            sizeLimit: 64Mi

      # n8n's own graceful shutdown (N8N_GRACEFUL_SHUTDOWN_TIMEOUT) defaults to 30s.
      terminationGracePeriodSeconds: 45
