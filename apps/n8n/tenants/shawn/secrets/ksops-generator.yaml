# KSOPS generator: decrypts the SOPS files below at sync time (clusters/homelab/bootstrap/SECRETS-SOPS.md).
# Paths in `files:` are relative to the KUSTOMIZATION ROOT (apps/n8n/tenants/shawn), not to this file's folder.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: n8n-shawn-secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets/n8n-r2-backup.enc.yaml
