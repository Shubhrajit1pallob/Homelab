# PrometheusRule — Prometheus Operator picks this up automatically.
# ruleSelector: {} in values.yaml means no label filter is applied,
# so this rule is loaded regardless of which release chart name is set.
# Relies on node-exporter metrics, which is why node-exporter also runs on the tainted server-1.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-exhaustion-alerts
  namespace: monitoring
spec:
  groups:
    - name: node-exhaustion
      rules:
        # node-exporter series have no `node` label, so both memory rules join node_uname_info for the node's
        # name (`nodename`); `{{ $labels.node }}` used to print nothing. The comparison is in parentheses because
        # `*` binds tighter than `<`; node_uname_info is always 1, so the value stays the percentage.
        - alert: NodeMemoryExhaustion
          expr: |
            ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10)
              * on (instance) group_left (nodename) node_uname_info
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node memory exhaustion on {{ $labels.nodename }}"
            description: "Available memory is {{ $value | printf \"%.1f\" }}% — OOMKills likely imminent."

        # Early warning before NodeMemoryExhaustion (90% used). server-1 normally runs ~65-67% and peaked at
        # 73.4% in the 7 days to 2026-10-21 (never above 75%), so this fires on a real change, not on a busy day.
        - alert: NodeMemoryHigh
          expr: |
            ((1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 75)
              * on (instance) group_left (nodename) node_uname_info
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Memory above 75% on {{ $labels.nodename }}"
            description: "{{ $value | printf \"%.1f\" }}% of memory is in use. NodeMemoryExhaustion fires at 90%."

        - alert: PodOOMKilled
          # Both from kube-state-metrics. A restart in the last 5 min whose previous run ended in OOMKilled, so it
          # fires once per OOM kill. The termination reason alone would stay set until the next termination.
          # Other crashes are the chart's KubePodCrashLooping.
          expr: |
            (increase(kube_pod_container_status_restarts_total[5m]) > 0)
              and on (namespace, pod, container)
            (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} was OOMKilled"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }} hit its memory limit and was restarted."

        - alert: NodeCPUSaturation
          expr: |
            100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU on {{ $labels.instance }}"
            description: "CPU usage is {{ $value | printf \"%.1f\" }}%."

        - alert: NodeDiskAlmostFull
          expr: |
            (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Disk space low on {{ $labels.instance }}"
            description: "Only {{ $value | printf \"%.1f\" }}% disk remaining."
