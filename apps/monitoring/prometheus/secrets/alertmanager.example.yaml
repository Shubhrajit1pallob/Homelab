# REDACTED copy of the Alertmanager config, for review only. NOT deployed: no kustomization lists it. The real
# config is key alertmanager.yaml of Secret alertmanager-config (alertmanager-config.enc.yaml, next to this file),
# encrypted because it holds the Gmail address and app password. Keep the two in step: change the routing here
# and in the Secret (`sops edit`) in the same commit. Only the four placeholder values differ.
global:
  resolve_timeout: 5m
  # Gmail SMTP with STARTTLS. auth_password is a Google APP PASSWORD (needs 2-Step Verification on the account),
  # never the account password.
  smtp_smarthost: smtp.gmail.com:587
  smtp_require_tls: true
  smtp_from: you@example.com
  smtp_auth_username: you@example.com
  smtp_auth_password: app-password-here

route:
  receiver: email
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # The chart's always-firing alerts. Watchdog would be a dead man's switch if sent to an outside checker (not
    # set up for now); InfoInhibitor exists only to mute info alerts (inhibit_rules below).
    - receiver: "null"
      matchers:
        - alertname =~ "Watchdog|InfoInhibitor"
    # When Prometheus (or shubmedia's network) blips, every target in every namespace goes down at once; grouping
    # by namespace would send one email per namespace (~10 on 2026-10-21). One email for the whole burst.
    - receiver: email
      matchers:
        - alertname = "TargetDown"
      group_by: [alertname]
    - receiver: email
      matchers:
        - severity = "critical"
      repeat_interval: 2h

receivers:
  - name: "null"
  - name: email
    email_configs:
      - to: you@example.com
        send_resolved: true
        # Short subject: "[FIRING:1] CloudflaredDown (cloudflared): No cloudflared replica is ready" /
        # "[RESOLVED] N8nDown (n8n): n8n is down". The default subject prints every common label (pod, instance, job...).
        # The namespace and summary parts are left out when the group has no common value (e.g. two alerts with
        # different summaries), leaving "[FIRING:2] NodeMemoryHigh". Rendered and checked with `amtool template render`.
        headers:
          Subject: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}{{ with .CommonAnnotations.summary }}: {{ . }}{{ end }}'

# The chart's default inhibit rules (kube-prometheus-stack 91.7.0, alertmanager.config).
inhibit_rules:
  # A critical alert mutes the warning (and info) alert with the same name in the same namespace.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity =~ "warning|info"
    equal: [namespace, alertname]
  - source_matchers:
      - severity = "warning"
    target_matchers:
      - severity = "info"
    equal: [namespace, alertname]
  # InfoInhibitor fires while a namespace has info alerts and nothing worse, so info alerts alone never email.
  - source_matchers:
      - alertname = "InfoInhibitor"
    target_matchers:
      - severity = "info"
    equal: [namespace]
  - target_matchers:
      - alertname = "InfoInhibitor"
