# Values for kube-prometheus-stack (Helm chart 91.7.0), consumed by
# clusters/homelab/applications/kube-prometheus-stack.yaml through its `$values` source.
#
# Sized for a 3-node K3s cluster with ~5.5 GiB free RAM across the two workers: server-1 is tainted and
# nearly full, agent-1 has a single vCPU, and shubmedia (4 CPU, laptop) hosts the heavy pieces.
# When shubmedia is replaced, change every `kubernetes.io/hostname: shubmedia` selector below.

# Alertmanager (enabled 2026-10-21): email through Gmail SMTP. Its whole config (routing AND the Gmail address and
# app password) is Secret alertmanager-config, SOPS-encrypted in secrets/alertmanager-config.enc.yaml; the same
# routing with placeholder addresses is in secrets/alertmanager.example.yaml for review. No public route: reach it
# with `kubectl -n monitoring port-forward svc/kube-prometheus-stack-alertmanager 9093:9093`.
alertmanager:
  enabled: true
  # Chart default, stated because Prometheus must scrape Alertmanager for the chart's alertmanager rules.
  serviceMonitor:
    selfMonitor: true
  alertmanagerSpec:
    # The chart's own config Secret is not rendered; the operator reads key alertmanager.yaml of this one.
    useExistingSecret: true
    configSecret: alertmanager-config
    replicas: 1
    retention: 120h
    # Links in the emails point here, which works while the port-forward above is running.
    externalUrl: http://127.0.0.1:9093
    nodeSelector:
      kubernetes.io/hostname: shubmedia
    # The operator's config-reloader sidecar gets prometheusOperator.prometheusConfigReloader's resources below.
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
    # Silences and the notification log survive a restart. local-path, so on shubmedia's disk.
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

# K3s runs these control-plane components inside the k3s process and does not expose them as scrapeable
# endpoints, so their targets would sit permanently "down" and their default rules would be noise.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
# K3s runs the apiserver, kine/etcd and controllers in the same process as the kubelet, so server-1's kubelet
# /metrics endpoint re-exports every control-plane metric the `apiserver` job already scrapes: ~51k of ~118k
# series (measured 2026-10-17), doubling Prometheus memory and disk. Drop them on the kubelet /metrics
# endpoint only (cAdvisor, probes and the apiserver job are untouched). Every chart rule and dashboard that
# reads these families selects job="apiserver", so nothing loses data. Kept: kubelet_*, rest_client_*,
# storage_operation_*, volume_*, process_*, go_*. Plan: apps/monitoring/METRICS-HISTORY-PLAN.md (phase 0).
# Rollback: delete the second entry.
kubelet:
  serviceMonitor:
    metricRelabelings:
      # Chart default (91.7.0), kept: a list here replaces the chart's list instead of merging with it.
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd|workqueue|apiextensions|aggregator|authentication|authorization|admission|field_validation|flowcontrol|kine|serviceaccount|node_authorizer|watch_cache|grpc)_.*

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheusOperator:
  resources:
    requests: {cpu: 30m, memory: 64Mi}
    limits: {memory: 128Mi}
  nodeSelector:
    kubernetes.io/hostname: shubmedia
  # The operator adds a config-reloader sidecar to the Prometheus pod; its default is no requests/limits.
  prometheusConfigReloader:
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 32Mi}
  admissionWebhooks:
    patch: # the admission-create / admission-patch hook Jobs
      nodeSelector:
        kubernetes.io/hostname: shubmedia
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}

prometheus:
  prometheusSpec:
    scrapeInterval: 60s # default is 30s; halving the sample rate roughly halves memory and disk use
    evaluationInterval: 60s
    retention: 7d
    retentionSize: 4GB # hard cap, below the 5Gi volume so it can never fill the disk
    nodeSelector:
      kubernetes.io/hostname: shubmedia
    resources:
      requests: {cpu: 100m, memory: 300Mi}
      # No CPU limit on purpose: throttling a scrape/compaction burst helps nobody here.
      limits: {memory: 768Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

    # Pick up our own PrometheusRule / ServiceMonitor objects regardless of Helm release labels.
    ruleSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}

kubeStateMetrics:
  enabled: true
kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: shubmedia
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}

nodeExporter:
  enabled: true
prometheus-node-exporter:
  # Deliberately runs on the tainted control-plane node too: server-1 is the tightest node (~64% memory
  # used) and node-alerts.yaml alerts on node memory, so it is the one host we most need metrics for.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      effect: NoSchedule
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 48Mi}
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)

grafana:
  # The admin login comes from Secret grafana-admin, SOPS-encrypted in secrets/grafana-admin.enc.yaml (edit with
  # `sops edit`; see clusters/homelab/bootstrap/SECRETS-SOPS.md). Never put a password in this file.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  nodeSelector:
    kubernetes.io/hostname: shubmedia
  # With a ReadWriteOnce volume a rolling update would wait forever for the old pod to release it.
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes: ["ReadWriteOnce"]
    size: 1Gi
  service:
    type: ClusterIP # exposed through Traefik (see grafana-route.yaml), not a NodePort
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 640Mi}
  initChownData:
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 32Mi}
  # Read-only Supabase connection for the portfolio's page view counter (table analytics.page_views, written
  # by the portfolio app; SQL in the portfolio repo's db/page_views.sql). Credentials come from a Secret,
  # expanded into the datasource below at startup. Optional, so Grafana still starts without it.
  # This Secret is SOPS-encrypted in apps/monitoring/prometheus/secrets/grafana-supabase.enc.yaml; edit with
  # `sops edit apps/monitoring/prometheus/secrets/grafana-supabase.enc.yaml`. See
  # clusters/homelab/bootstrap/SECRETS-SOPS.md.
  # After changing a value, restart Grafana (kubectl -n monitoring rollout restart deploy/kube-prometheus-stack-grafana).
  envFromSecrets:
    - name: grafana-supabase
      optional: true
  additionalDataSources:
    - name: Supabase analytics
      uid: supabase-analytics
      type: grafana-postgresql-datasource
      url: $SUPABASE_PG_HOST
      user: $SUPABASE_PG_USER
      editable: false
      jsonData:
        database: postgres
        sslmode: require
        maxOpenConns: 2
      secureJsonData:
        password: $SUPABASE_PG_PASSWORD
  grafana.ini:
    server:
      # Grafana builds redirects and links from this. It is the public (Cloudflare Access) hostname.
      root_url: https://grafana.shubhrajitpallob.dev
  # Sidecar hot-loads any ConfigMap labelled grafana_dashboard: "1" from every namespace.
  sidecar:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
