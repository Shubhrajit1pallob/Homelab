# Synced by clusters/homelab/parked/monitoring-config.yaml. The chart itself (and the `monitoring`
# namespace) come from kube-prometheus-stack.yaml; values are in values.yaml here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - node-alerts.yaml
  - n8n-alerts.yaml
  - dashboard-configmap.yaml
  - portfolio-views-dashboard.yaml
  - portfolio-servicemonitor.yaml
  - rag-api-servicemonitor.yaml
  - rag-api-alerts.yaml
  - rag-api-dashboard.yaml
  - grafana-route.yaml
# Secrets grafana-supabase, grafana-admin and alertmanager-config, SOPS-encrypted in secrets/ (see
# clusters/homelab/bootstrap/SECRETS-SOPS.md). secrets/alertmanager.example.yaml is a redacted copy, not deployed.
generators:
  - secrets/ksops-generator.yaml
