# Grafana is reachable two ways. A DNS name can't be both a proxied Cloudflare tunnel name and a direct
# Tailscale address, so each path gets its own hostname:
#   grafana.shubhrajitpallob.dev     public, behind Cloudflare Access (tunnel -> plain HTTP on the `web` entrypoint;
#                                    Cloudflare terminates TLS and Access does the login)
#   grafana-ts.shubhrajitpallob.dev  direct over Tailscale (grey-cloud DNS record -> a node's Tailscale IP;
#                                    Traefik serves the wildcard cert from the default TLSStore)
# Manual steps outside Git: a Cloudflare Access application + published tunnel route for the public name,
# and a DNS-only record for the -ts name.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.shubhrajitpallob.dev`) || Host(`grafana-ts.shubhrajitpallob.dev`)
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`grafana.shubhrajitpallob.dev`)
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
